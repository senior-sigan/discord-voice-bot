[tools]
ffmpeg = "9"
node = "24"

[tasks.install]
description = "Install the locked Node.js dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.check]
description = "Type-check, lint, and check formatting"
depends = ["install"]
run = "npm run check"

[tasks.start]
description = "Type-check and start the bot, automatically joining the master voice channel"
depends = ["install"]
run = "npm start -- --autojoin"

[tasks.sleep]
description = "Process all conversation history into memories and profiles"
depends = ["install"]
run = "npm run sleep -- all"

[tasks."stt:gigaam:download"]
description = "Download the pinned GigaAM-v3 RNN-T INT8 model for sherpa-onnx"
run = '''
#!/usr/bin/env bash
set -euo pipefail
model_dir="models/sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16"
base_url="https://huggingface.co/csukuangfj/sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/resolve/0424d62637b37d8b7b1eb0f75a04d78dec55fdcc"
mkdir -p "$model_dir"
for file in encoder.int8.onnx decoder.onnx joiner.onnx tokens.txt LICENSE; do
  curl --fail --location --show-error --retry 3 "$base_url/$file" -o "$model_dir/$file.part"
  mv "$model_dir/$file.part" "$model_dir/$file"
done
'''

[tasks."stt:qwen"]
description = "Start the local Qwen3-ASR MLX HTTP server"
quiet = true
tools = { python = "3.12", uv = "latest" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${MLX_ASR_API_KEY:?Set MLX_ASR_API_KEY in mise.local.toml}"
export UV_OFFLINE=0
exec uvx --python 3.12 --from 'mlx-qwen3-asr[serve]==0.4.0' mlx-qwen3-asr serve \
  --host 127.0.0.1 \
  --port 8765 \
  --model Qwen/Qwen3-ASR-0.6B
'''

[tasks."stt:qwen:health"]
description = "Check the local Qwen3-ASR HTTP server"
run = "curl --silent --show-error --fail-with-body http://127.0.0.1:8765/health"

[tasks.default]
description = "Start the bot with voice-channel auto-join"
depends = ["start"]
