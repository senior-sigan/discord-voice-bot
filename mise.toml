[tools]
ffmpeg = "9"
node = "lts"

[tasks.install]
description = "Install the locked Node.js dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.check]
description = "Type-check, lint, and test the project"
depends = ["install"]
run = "npm run check"

[tasks.start]
description = "Build and start the bot, automatically joining the master voice channel"
depends = ["install"]
run = "npm start -- --autojoin"

[tasks.default]
description = "Start the bot with voice-channel auto-join"
depends = ["start"]
